version: 2

project_name: sdd

before:
  hooks:
    - go mod tidy

builds:
  - id: sdd
    main: ./cmd/sdd
    binary: sdd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - ids:
      - sdd

# GITHUB_REPOSITORY_OWNER is set by GitHub Actions, so the release, the tap
# and the cask homepage follow whichever repository runs the release.
homebrew_casks:
  - name: sdd
    # auto: no cask for prerelease tags — brew users track stable. A
    # repository whose releases are all prereleases sets the Actions variable
    # HOMEBREW_CASK_SKIP_UPLOAD to false.
    skip_upload: "{{ with .Env.HOMEBREW_CASK_SKIP_UPLOAD }}{{ . }}{{ else }}auto{{ end }}"
    repository:
      owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/{{ .Env.GITHUB_REPOSITORY_OWNER }}/sdd"
    description: Signal-Dialogue-Decision graph tool
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/sdd"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
    name: sdd
  # Without this the default (false) overwrites a prerelease flag already set on the release.
  prerelease: auto
  extra_files:
    - glob: "{{ with .Env.SDD_INSTALLER }}{{ . }}{{ else }}install.sh{{ end }}"
      name_template: install.sh
