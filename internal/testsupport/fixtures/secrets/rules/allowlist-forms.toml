[allowlist]
regexTarget = "line"
regexes = ['''global-single''']

[[allowlists]]
regexTarget = "line"
regexes = ['''global-multiple''']

[[rules]]
id = "sdd-fixture-token"
regex = '''sddfixture_[a-z0-9]{16}'''
keywords = ["sddfixture_"]

[rules.allowlist]
regexTarget = "line"
regexes = ['''rule-single''']

[[rules.allowlists]]
regexTarget = "line"
regexes = ['''rule-multiple''']
